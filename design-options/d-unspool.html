<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D · Unspool · Dan Baglini</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  :root { --sky: #d5e2ea; --ink: #142028; --violet: #7a3cf0; --violet-deep: #6a3ad6; --paper: #f7fbff; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: "Schibsted Grotesk", sans-serif; overflow-x: hidden; }
  a { color: inherit; }

  /* Split headline: each letter rises in on its own delay */
  .split span { display: inline-block; opacity: 0; transform: translateY(0.6em) rotate(6deg); animation: letter 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(var(--i) * 28ms + 0.15s); }
  @keyframes letter { to { opacity: 1; transform: none; } }

  header { display: flex; justify-content: space-between; padding: 1.2rem 6vw; font-weight: 700; letter-spacing: -0.03em; position: relative; z-index: 2; }
  header a { text-decoration: none; }
  header nav a { margin-left: 1.4rem; }
  header nav a:hover { text-decoration: underline; text-underline-offset: 0.18em; }

  .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 2rem; align-items: center; padding: 3vh 6vw 6vh; min-height: 72vh; }
  h1 { font-size: clamp(3.4rem, 9vw, 8.5rem); line-height: 0.84; letter-spacing: -0.05em; margin: 0; }
  .lede { font-size: 1.25rem; line-height: 1.35; max-width: 34ch; margin: 1.6rem 0 0; opacity: 0; animation: fade 1s ease 0.9s forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* The tile tilts in 3D toward the pointer; it also breathes */
  .stage3d { perspective: 900px; justify-self: center; width: min(430px, 90%); }
  .tile { width: 100%; display: block; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); animation: drop 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotateX(40deg); } to { opacity: 1; transform: none; } }

  /* Film strip: sprocket band top and bottom */
  .film { position: relative; background: #0f1a22; padding: 1.1rem 0; margin: 0 0 2rem; }
  .film::before, .film::after { content: ""; position: absolute; left: 0; right: 0; height: 14px; background: repeating-linear-gradient(90deg, #d5e2ea 0 14px, transparent 14px 34px); opacity: 0.35; }
  .film::before { top: 6px; } .film::after { bottom: 6px; }
  .film-head { display: flex; justify-content: space-between; padding: 0 6vw 0.7rem; color: #cfe0ea; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .viewer { position: relative; margin: 0 6vw; aspect-ratio: 16 / 8; overflow: hidden; background: #000; }
  .viewer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; clip-path: inset(100% 0 0 0); transition: clip-path 0.8s cubic-bezier(0.7, 0, 0.2, 1); }
  .viewer img.on { clip-path: inset(0 0 0 0); z-index: 1; }
  .caption { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin: 1.2rem 6vw 0; color: #cfe0ea; }
  .caption h2 { margin: 0; font-size: clamp(1.8rem, 3.6vw, 3rem); letter-spacing: -0.04em; line-height: 0.95; color: #fff; }
  .caption p { margin: 0.4rem 0 0; }
  .go { font-weight: 700; text-decoration: none; background: var(--violet); color: #fff; padding: 0.7rem 1.1rem; white-space: nowrap; transition: background 0.3s; }
  .go:hover { background: var(--violet-deep); }

  .strip { display: flex; gap: 0.8rem; overflow-x: auto; padding: 1.4rem 6vw 1rem; scrollbar-width: none; }
  .strip button { flex: 0 0 8.5rem; border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: #cfe0ea; text-align: left; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s; opacity: 0.55; }
  .strip button:hover { opacity: 0.9; transform: translateY(-4px); }
  .strip button.on { opacity: 1; transform: translateY(-10px); }
  .strip button img { width: 100%; height: 5rem; object-fit: cover; display: block; outline: 2px solid transparent; transition: outline-color 0.3s; }
  .strip button.on img { outline-color: var(--violet); }
  .strip button span { display: block; margin-top: 0.3rem; font-size: 0.85rem; font-weight: 700; }

  .film-bottom { height: 1.4rem; }
  footer { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 0 6vw; padding: 1.4rem 0 2.6rem; font-weight: 700; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--violet); }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .stage3d { order: -1; width: 55%; }
    header nav { display: none; }
    .caption { flex-direction: column; align-items: start; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .split span, .lede, .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <a href="#">Dan Baglini</a>
  <nav><a href="#work">Work</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero">
  <div>
    <h1 class="split" id="headline" aria-label="Shipped, not just sketched.">Shipped,<br />not just<br />sketched.</h1>
    <p class="lede">Former Army intelligence officer. Yale SOM MBA candidate. Building tools, games, and research sites.</p>
  </div>
  <div class="stage3d" id="stage">
    <img class="tile" src="../src/assets/hero.png" alt="" />
  </div>
</section>

<section id="work" class="reveal">
  <div class="film">
    <div class="film-head"><span>Selected work</span><span id="count">01 / 07</span></div>
    <div class="viewer" id="viewer"></div>
    <div class="caption">
      <div><h2 id="title"></h2><p id="line"></p></div>
      <a class="go" id="cta" target="_blank" rel="noopener noreferrer" href="#">Open</a>
    </div>
    <div class="strip" id="strip" role="group" aria-label="Projects"></div>
    <div class="film-bottom"></div>
  </div>
</section>

<footer id="contact" class="reveal">
  <a href="mailto:dan.baglini@yale.edu">dan.baglini@yale.edu</a>
  <a href="/Baglini%20Resume%20Yale%20Format.pdf">Resume</a>
  <a href="https://www.linkedin.com/in/daniel-baglini/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <a href="https://github.com/Baggs99" target="_blank" rel="noopener noreferrer">GitHub</a>
</footer>

<script>
// Split the headline into letters for the staggered rise
const headline = document.getElementById("headline");
let i = 0;
headline.innerHTML = headline.innerHTML.replace(/(<br>|<br\/>|<br \/>)|([^<])/g, (m, br, ch) => {
  if (br) return br;
  return `<span style="--i:${i++}">${ch === " " ? "&nbsp;" : ch}</span>`;
});

// Pointer tilt on the tile
const stage = document.getElementById("stage");
const tile = stage.querySelector(".tile");
stage.addEventListener("pointermove", (e) => {
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  tile.style.setProperty("--ry", `${x * 18}deg`);
  tile.style.setProperty("--rx", `${-y * 14}deg`);
});
stage.addEventListener("pointerleave", () => { tile.style.setProperty("--rx", "0deg"); tile.style.setProperty("--ry", "0deg"); });

const projects = [
  ["Final Dayz", "final-dayz", "Hold the box. Survive the waves.", "https://zombie.baglini.co/", "Play"],
  ["Case Repo", "case-repo", "A searchable case library for consulting interviews.", "https://cases.baglini.co/", "Browse"],
  ["RI Calculator", "ri-school-consolidation", "What consolidation would change in Rhode Island schools.", "https://calc.baglini.co", "Open"],
  ["4 Connect", "4-connect", "Connect Four, with opponents that think.", "/4-connect/", "Play"],
  ["ELC Outreach", "elc-outreach", "Personalized outreach for the Education Leadership Conference.", "https://elc.baglini.co", "Open"],
  ["AUWM", "auwm", "African urban worship music, in research and media.", "https://auwm.baglini.co/", "View"],
  ["Consulting Club", "yale-som-consulting-club", "Recruiting resources for Yale SOM.", "https://yalesomconsultingclub.com/", "Visit"]
];
const viewer = document.getElementById("viewer");
const strip = document.getElementById("strip");
let current = 0;
projects.forEach((p, n) => {
  const img = document.createElement("img");
  img.src = `../public/previews/${p[1]}.png`; img.alt = p[0];
  viewer.appendChild(img);
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<img alt="" src="../public/previews/${p[1]}.png"><span>${p[0]}</span>`;
  b.onclick = () => show(n);
  strip.appendChild(b);
});
function show(n) {
  current = n;
  const p = projects[n];
  [...viewer.children].forEach((img, k) => img.classList.toggle("on", k === n));
  [...strip.children].forEach((b, k) => b.classList.toggle("on", k === n));
  document.getElementById("count").textContent = `${String(n + 1).padStart(2, "0")} / ${String(projects.length).padStart(2, "0")}`;
  document.getElementById("title").textContent = p[0];
  document.getElementById("line").textContent = p[2];
  const cta = document.getElementById("cta");
  cta.textContent = p[4]; cta.href = p[3];
  const btn = strip.children[n];
  strip.scrollTo({ left: btn.offsetLeft - (strip.clientWidth - btn.offsetWidth) / 2, behavior: "smooth" });
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(Math.min(projects.length - 1, current + 1));
  if (e.key === "ArrowLeft") show(Math.max(0, current - 1));
});
show(0);

// Scroll reveal
const io = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
</script>
</body>
</html>
