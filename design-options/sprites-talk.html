<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talk sprite · Dan Baglini</title>
<style>
  body { margin: 0; font-family: "Schibsted Grotesk", sans-serif; color: #f4f1e8; background: #0f1b4d; padding: 3rem 6vw; }
  h1 { font-size: clamp(2.6rem, 6vw, 4.5rem); letter-spacing: -0.05em; margin: 0 0 0.8rem; line-height: 0.92; }
  p { color: #b9c3ea; max-width: 56ch; line-height: 1.4; }
  .row { display: flex; gap: 1.4rem; flex-wrap: wrap; margin-top: 2rem; }
  .box { display: grid; place-items: center; width: 360px; height: 260px; background: #1f2f7a; }
  .box img { width: 78%; }
  .sky { background: #d5e2ea; }
  .small { width: 96px; height: 64px; background: #1f2f7a; display: grid; place-items: center; }
  .small img { width: 90%; }
  .label { margin-top: 0.6rem; font-size: 0.9rem; color: #b9c3ea; }
</style>
</head>
<body>
<h1>Computers talking.</h1>
<p>The bubble types DPB, turns green on send, and a reply lands back with ACK. One loop, six seconds, pure SVG so it runs as an image anywhere.</p>
<div class="row">
  <div><div class="box"><img src="sprites/5-talk-animated.svg" alt="" /></div><div class="label">Large, navy ground</div></div>
  <div><div class="box sky"><img src="sprites/5-talk-animated.svg" alt="" /></div><div class="label">Large, sky ground</div></div>
  <div><div class="small"><img src="sprites/5-talk-animated.svg" alt="" /></div><div class="label">Favicon-ish size</div></div>
</div>
</body>
</html>
