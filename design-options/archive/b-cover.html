<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B · The Cover · Dan Baglini</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  :root { --night: #0c0c12; --ink: #f2f0fa; --dim: #aaa7c0; --violet: #8f5cff; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font-family: "Schibsted Grotesk", sans-serif; }
  body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  a { color: inherit; }

  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .rise { animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 1.3rem 5vw; position: relative; z-index: 2; }
  header a { text-decoration: none; font-weight: 700; letter-spacing: -0.03em; }
  .mark { width: 46px; height: auto; animation: drift 9s ease-in-out infinite; }

  /* Full-bleed cover: type on the left, the active screenshot on the right */
  .cover { position: relative; display: grid; grid-template-columns: 1fr 1.3fr; align-items: center; padding: 0 0 0 5vw; }
  .copy { position: relative; z-index: 2; }
  .kicker { color: var(--dim); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; margin: 0 0 1rem; }
  h1 { font-size: clamp(3.6rem, 10vw, 10rem); line-height: 0.82; letter-spacing: -0.06em; margin: 0; word-break: break-word; }
  #line { font-size: 1.2rem; max-width: 30ch; color: var(--dim); margin: 1.4rem 0 1.8rem; min-height: 3em; }
  .go { display: inline-block; font-weight: 700; color: var(--night); background: var(--ink); padding: 0.85rem 1.4rem; text-decoration: none; }
  .go:hover { background: #6a3ad6; color: #fff; }

  .frame { height: 100%; min-height: 60vh; position: relative; overflow: hidden; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transform: scale(1.08); transition: opacity 0.7s ease, transform 1.6s cubic-bezier(0.22, 1, 0.36, 1); opacity: 0; }
  .frame img.on { opacity: 1; transform: scale(1); }
  .frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--night) 0%, rgba(12, 12, 18, 0) 35%); }

  @keyframes drift { 50% { transform: translateY(-6px) rotate(4deg); } }

  .index { display: flex; gap: 2.2rem; flex-wrap: wrap; padding: 1.4rem 5vw 1.6rem; border-top: 1px solid #2a2936; position: relative; z-index: 2; }
  .index button { background: none; border: 0; padding: 0; font: inherit; font-size: clamp(1.1rem, 2vw, 1.6rem); letter-spacing: -0.03em; color: var(--dim); cursor: pointer; transition: color 0.3s; }
  .index button:hover, .index button.on { color: var(--ink); }
  .index button.on { text-decoration: underline; text-decoration-color: var(--violet); text-decoration-thickness: 3px; text-underline-offset: 0.3em; }

  .contact { display: flex; gap: 1.6rem; flex-wrap: wrap; padding: 0 5vw 1.6rem; font-size: 0.95rem; position: relative; z-index: 2; }
  .contact a { color: var(--dim); text-decoration: none; }
  .contact a:hover { color: var(--ink); }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .cover { grid-template-columns: 1fr; padding: 0 5vw; }
    .frame { min-height: 42vh; order: -1; margin: 0 -5vw; }
    .frame::after { background: linear-gradient(0deg, var(--night) 0%, rgba(12, 12, 18, 0) 50%); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="rise">
  <a href="#">Dan Baglini</a>
  <img class="mark" src="../src/assets/hero.png" alt="" />
  <a href="mailto:dan.baglini@yale.edu">dan.baglini@yale.edu</a>
</header>

<main class="cover">
  <div class="copy">
    <p class="kicker rise" id="kicker">Project 01 of 07</p>
    <h1 class="rise" id="title" style="animation-delay:0.1s">Final Dayz</h1>
    <p id="line" class="rise" style="animation-delay:0.2s">Hold the box. Survive the waves.</p>
    <a class="go rise" id="cta" href="https://zombie.baglini.co/" target="_blank" rel="noopener noreferrer" style="animation-delay:0.3s">Play</a>
  </div>
  <div class="frame" id="frame">
    <img class="on" src="../public/previews/final-dayz.png" alt="Final Dayz" />
  </div>
</main>

<nav class="index" id="index" aria-label="Projects"></nav>

<div class="contact rise" style="animation-delay:0.5s">
  <a href="/Baglini%20Resume%20Yale%20Format.pdf">Resume</a>
  <a href="https://www.linkedin.com/in/daniel-baglini/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <a href="https://github.com/Baggs99" target="_blank" rel="noopener noreferrer">GitHub</a>
</div>

<script>
const projects = [
  ["Final Dayz", "final-dayz", "Hold the box. Survive the waves.", "https://zombie.baglini.co/", "Play"],
  ["Case Repo", "case-repo", "A searchable case library for consulting interviews.", "https://cases.baglini.co/", "Browse"],
  ["RI Calculator", "ri-school-consolidation", "What consolidation would change in Rhode Island schools.", "https://calc.baglini.co", "Open"],
  ["4 Connect", "4-connect", "Connect Four, with opponents that think.", "/4-connect/", "Play"],
  ["ELC Outreach", "elc-outreach", "Personalized outreach for the Education Leadership Conference.", "https://elc.baglini.co", "Open"],
  ["AUWM", "auwm", "African urban worship music, in research and media.", "https://auwm.baglini.co/", "View"],
  ["Consulting Club", "yale-som-consulting-club", "Recruiting resources for Yale SOM.", "https://yalesomconsultingclub.com/", "Visit"]
];
const frame = document.getElementById("frame");
const index = document.getElementById("index");
let current = 0;
projects.forEach((p, n) => {
  const img = document.createElement("img");
  img.src = `../public/previews/${p[1]}.png`; img.alt = p[0];
  frame.appendChild(img);
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = p[0];
  b.onclick = () => show(n);
  index.appendChild(b);
});
function show(i) {
  current = i;
  const p = projects[i];
  [...frame.children].forEach((img, n) => img.classList.toggle("on", n === i));
  [...index.children].forEach((b, n) => b.classList.toggle("on", n === i));
  document.getElementById("kicker").textContent = `Project ${String(i + 1).padStart(2, "0")} of ${String(projects.length).padStart(2, "0")}`;
  document.getElementById("title").textContent = p[0];
  document.getElementById("line").textContent = p[2];
  const cta = document.getElementById("cta");
  cta.textContent = p[4]; cta.href = p[3];
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(Math.min(projects.length - 1, current + 1));
  if (e.key === "ArrowLeft") show(Math.max(0, current - 1));
});
show(0);
</script>
</body>
</html>
