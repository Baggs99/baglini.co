<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <style>
    .bubble { animation: sent 6s ease-in-out infinite; }
    @keyframes sent { 0%, 40% { fill: #ffb020; } 42%, 92% { fill: #3ddc84; } 97%, 100% { fill: #ffb020; } }
  </style>
  <!-- Machine A: types DPB, then sends -->
  <path class="bubble" d="M34 22 H156 A12 12 0 0 1 168 34 V84 A12 12 0 0 1 156 96 H84 L58 120 V96 H34 A12 12 0 0 1 22 84 V34 A12 12 0 0 1 34 22 Z" fill="#ffb020"/>
  <g font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="30" fill="#0f1b4d">
    <text x="40" y="70">&gt;</text>
    <text x="66" y="70" opacity="0">D<animate attributeName="opacity" values="0;1" keyTimes="0;0.1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="94" y="70" opacity="0">P<animate attributeName="opacity" values="0;1" keyTimes="0;0.2" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="122" y="70" opacity="0">B<animate attributeName="opacity" values="0;1" keyTimes="0;0.3" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <rect x="150" y="50" width="14" height="4" opacity="1">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Machine B: replies ACK -->
  <g opacity="0">
    <rect x="128" y="112" width="92" height="34" rx="9" fill="#f4f1e8"/>
    <text x="174" y="135" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="16" fill="#0f1b4d">ACK ✓</text>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.483;0.9" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
